name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod pins "go 1.25.0" (modernc.org/sqlite forced the floor)
          # and the Dockerfile builds on golang:1.25-alpine for the same
          # reason. Keep this in lockstep with both or the build breaks.
          go-version: '1.25'
      - run: go vet ./...
      # internal/proxy/integration_test.go lives behind "//go:build docker" so
      # it never runs as part of normal `go test`/`go vet` — without this it
      # can rot into a compile error unnoticed until someone tries to run it
      # by hand. This only type-checks it (no Docker daemon needed); the test
      # itself still requires one and is run separately by the smoke job.
      - run: go vet -tags docker ./...
      - run: go test -race ./...

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run the one-click install smoke test
        run: ./scripts/smoke.sh
