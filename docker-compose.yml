services:
  caddy:
    image: caddy:2-alpine
    container_name: mtpanel-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    environment:
      # The domain switch is computed here rather than in the Caddyfile.
      # Compose's ${VAR:-default} treats an empty value like an unset one,
      # while Caddy's {$VAR:default} falls back only when the variable is
      # absent — and Compose always passes it through, so a Caddyfile-side
      # default would never fire for the shipped ".env" with an empty
      # PANEL_DOMAIN. Result: "<domain>:8443", else "localhost:8443".
      - PANEL_SITE=${PANEL_DOMAIN:-localhost}:8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - mtpanel_net
    depends_on:
      - panel

  panel:
    build: .
    image: telemt-panel:local
    container_name: mtpanel
    restart: unless-stopped
    environment:
      - PANEL_LISTEN=:8080
      - PANEL_DATA_DIR=/data
      - MTPANEL_NETWORK=mtpanel_net
      - MTPANEL_SUBNET=172.28.0.0/16
      - TELEMT_IMAGE=${TELEMT_IMAGE:-ghcr.io/telemt/telemt:latest}
      - PANEL_PUBLIC_HOST=${PANEL_PUBLIC_HOST:-}
      # Bind mount sources are resolved by the Docker daemon against the
      # HOST filesystem, so the panel needs the host's own path to ./data,
      # not the container's. ${PWD}/data works for the documented
      # interactive install (`cd telemt-panel && docker compose up -d`),
      # but $PWD is not reliably set outside an interactive shell — e.g. a
      # systemd unit invoking `docker compose up` — where it can render as
      # an empty string, silently collapsing this to "/data". That is
      # non-empty, so main.go's "PANEL_HOST_DATA_DIR is unset" warning never
      # fires, yet it is almost never a real host path: Docker creates it
      # anyway (empty) and every proxy's telemt starts with no config. Set
      # PANEL_HOST_DATA_DIR explicitly in .env (see .env.example) to sidestep
      # $PWD entirely for exactly this case; the panel also validates the
      # final value at startup and warns loudly if it still looks
      # implausible.
      - PANEL_HOST_DATA_DIR=${PANEL_HOST_DATA_DIR:-${PWD}/data}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    networks:
      - mtpanel_net

networks:
  mtpanel_net:
    name: mtpanel_net
    ipam:
      config:
        - subnet: 172.28.0.0/16
